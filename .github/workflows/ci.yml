name: CI - Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
        working-directory: backend

      - name: Build and test
        run: ./mvnw -B clean verify
        working-directory: backend

  docker-image:
    # L'image Docker n'est construite que si le build et les tests réussissent
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package the JAR
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests clean package
        working-directory: backend

      - name: Build Docker image (tag = commit SHA)
        run: docker build -t gestion-etudiants:${{ github.sha }} .
